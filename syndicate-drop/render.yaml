# Render Blueprint. Starter plan, because the free plan sleeps after 15 idle
# minutes, which would stop the monitor. The disk keeps your watchlist and ledger.
services:
  - type: web
    name: syndicate-drop
    runtime: node
    region: singapore
    plan: starter
    rootDir: syndicate-drop
    buildCommand: echo "no build step"
    startCommand: node src/server.js
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DASH_PASSWORD
        generateValue: true
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: ALERT_SMS_TO
        sync: false
