<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1216">
  <title>Offline · Business OS</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1216; color: #d3d8e0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { font-size: 20px; font-weight: 600; margin: 16px 0 6px; }
    p { color: #8b94a3; font-size: 14px; margin: 0 0 20px; }
    button { height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #8e97ef; color: #0f1216; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" style="border-radius:16px">
      <h1>You’re offline</h1>
      <p>Nothing is lost. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
