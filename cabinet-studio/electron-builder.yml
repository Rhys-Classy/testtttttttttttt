appId: com.cabinetstudio.app
productName: Cabinet Studio
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
fileAssociations:
  - ext: cabproj
    name: Cabinet Studio project
    role: Editor
win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.graphics-design
linux:
  target: AppImage
  category: Graphics
